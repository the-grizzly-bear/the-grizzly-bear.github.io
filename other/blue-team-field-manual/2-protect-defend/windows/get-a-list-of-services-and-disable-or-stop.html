<h1 id="title">Get a list of services and disable or stop</h1>
<pre><code class="language-bash">C:\&gt; sc query
C:\&gt; sc config "&lt;SERVICE NAME&gt;" start= disabled
C:\&gt; sc stop "&lt;SERVICE NAME&gt;"
C:\&gt; wmic service where name='&lt;SERVICE NAME&gt;' call ChangeStartmode Disabled</code></pre>

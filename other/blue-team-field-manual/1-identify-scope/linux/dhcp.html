<h1 id="title">DHCP</h1>
<p>View DHCP lease logs:<br>
Red Hat 3:</p>
<pre><code class="language-bash">cat /var/lib/dhcpd/dhcpd.leases</code></pre>
<p>Ubuntu:</p>
<pre><code class="language-bash">grep -Ei 'dhcp' /var/log/syslog.1</code></pre>
<p>Ubuntu DHCP logs:</p>
<pre><code class="language-bash">tail -f dhcpd.log</code></pre>

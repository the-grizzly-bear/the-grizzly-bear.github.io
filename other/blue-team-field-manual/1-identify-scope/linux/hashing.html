<h1 id="title">HASHING</h1>
<p>Hash all executable files in these specified<br>
locations:</p>
<pre><code class="language-bash">find /&lt;PATHNAME TO ENUMERATE&gt; -type f -exec mdSsum {} &gt;&gt; mdSsums.txt \; </code></pre>
<pre><code class="language-bash">md5deep -rs /&gt; mdSsums.txt</code></pre>
